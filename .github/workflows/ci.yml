name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacancies-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vacancies
          POSTGRES_PASSWORD: vacancies
          POSTGRES_DB: vacancies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacancies -d vacancies"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://vacancies:vacancies@localhost:5432/vacancies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: mypy app
      - run: pytest
      - run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vacancies-service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vacancies-service/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the app without model weights
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            cd vacancies-service
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

# Alembic configuration for vacancies-service.
#
# NOTE: comments in this file are intentionally ASCII-only, unlike the rest of
# the project. Alembic reads alembic.ini via ConfigParser with
# encoding="locale"; on this Windows host the locale codec is cp1251 and any
# UTF-8 Cyrillic byte raises UnicodeDecodeError before alembic even starts.
# Keep it ASCII - the Russian rationale lives in migrations/env.py.

[alembic]
# Relative path, not %(here)s/migrations: alembic is always invoked from the
# service root (venv on the host, WORKDIR /srv in the image), and an absolute
# path would differ between the two.
script_location = migrations

# Revision file names sort chronologically, so the order in versions/ matches
# the down_revision chain.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Required: without it "from app.config import get_settings" in env.py does not
# resolve - alembic is its own entry point and does not add the service root to
# sys.path by itself.
prepend_sys_path = .

# timezone is deliberately NOT set. The value is passed to ZoneInfo(), and
# Windows ships no system tz database, so "alembic revision" would fail with
# ZoneInfoNotFoundError unless the tzdata package is installed. Local time in
# the file name is enough to order revisions.
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# Use os.pathsep. Default configuration used for new projects.
path_separator = os

# set to 'true' to search source files recursively
# in each "version_locations" directory
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# The DSN is intentionally empty and must stay empty: the single source of
# truth is DATABASE_URL via app/config.py. A duplicate here would inevitably
# drift from .env and "alembic upgrade" would migrate a different database than
# the one the application talks to. env.py injects the value at runtime.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# Formatting hooks are deliberately not enabled: ruff/ruff format are run over
# the whole tree by the project checks, and a hook would hide the generated
# body behind a reformat before it can be reviewed.

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
#
# Left as generated on purpose: the alembic CLI configures its own logging
# here, while structlog is set up by the application only (app/logging.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

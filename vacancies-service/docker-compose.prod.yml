# Публикация на машине 2 ядра / 4 ГБ RAM / 40 ГБ SSD.
# Модель, Chromium, worker и scheduler сюда не входят: им не хватает памяти.
# Обычный `docker compose up` этот файл не читает.
#
# Запуск из папки vacancies-service:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: vacancies-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vacancies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-vacancies}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - wal_buffers=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacancies} -d ${POSTGRES_DB:-vacancies}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 96M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: vacancies-service:api
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vacancies}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-vacancies}
    command: alembic upgrade head
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: vacancies-service:api
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vacancies}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-vacancies}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
